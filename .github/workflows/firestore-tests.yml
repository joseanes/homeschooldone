name: Firestore rules & functions

on:
  pull_request:
  push:
    branches: [master]

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Lint functions
        run: npm --prefix functions run lint

      - name: Install test dependencies
        run: npm ci --prefix tests/firestore

      # Runs against the Firestore emulator under a demo- project ID;
      # never touches the live project.
      - name: Rules, function and migration tests
        run: npm --prefix tests/firestore test
